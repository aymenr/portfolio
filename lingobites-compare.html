<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lingobites video vs live</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lingobites-live.css?v=5">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f4f1fa; color: #1a1530; font: 400 16px/1.5 'Open Sans', system-ui, sans-serif; }
    header { padding: 40px clamp(16px, 4vw, 56px) 8px; }
    h1 { margin: 0 0 6px; font: 600 28px/1.2 'Open Sans', sans-serif; letter-spacing: -.02em; }
    header p { margin: 0; color: #5a5470; max-width: 60ch; }
    .row { padding: 36px clamp(16px, 4vw, 56px) 8px; }
    .row h2 { margin: 0 0 14px; font: 600 18px/1.3 'Open Sans', sans-serif; }
    .row h2 span { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 10px; border-radius: 50%; background: #fff; font-size: 13px; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 2.4vw, 32px); }
    figure { margin: 0; }
    figcaption { margin: 0 0 8px; font: 600 12px/1 'Open Sans', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #7b7394; }
    video { display: block; width: 100%; aspect-ratio: 1000 / 900; object-fit: cover; object-position: center; border-radius: 8px; background: #fff; box-shadow: 0 10px 24px rgba(80, 50, 140, .2); }
    @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Lingobites: video vs live</h1>
    <p>Left is the original screen recording, right is the HTML rebuild. Both play when scrolled into view.</p>
  </header>
  <main id="rows"></main>
  <script>
    var ROWS = [
      ['Memory mixer', 'ex-memory-mixer', 'memory-mixer'],
      ['Recall & Relate', 'ex-recall-relate', 'recall-relate'],
      ['Grammar in action', 'ex-grammar', 'grammar'],
      ['Prompt to discourage translations', 'd1-try-first', 'try-first'],
      ['Full translations at the end', 'd1-full-translations', 'full-translations'],
      ['3 tries to answer each question', 'd1-three-tries', 'three-tries'],
      ['Tiered score', 'feedback-tiers', 'feedback-tiers'],
      ['Score by section', 'feedback-breakdown', 'feedback-breakdown']
    ];
    var root = document.getElementById('rows');
    ROWS.forEach(function (r, i) {
      var s = document.createElement('section'); s.className = 'row';
      s.innerHTML = '<h2><span>' + (i + 1) + '</span>' + r[0] + '</h2><div class="pair">' +
        '<figure><figcaption>Video</figcaption><video src="videos/lingobites/' + r[1] + '.mp4" poster="videos/lingobites/' + r[1] + '.webp" muted loop playsinline preload="none"></video></figure>' +
        '<figure><figcaption>Live</figcaption><div class="lb-live" data-scene="' + r[2] + '" style="background-image:url(videos/lingobites/' + r[1] + '.webp)" role="img" aria-label="' + r[0] + '"></div></figure></div>';
      root.appendChild(s);
    });
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { var v = e.target; if (e.isIntersecting) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } else v.pause(); });
    }, { threshold: .3 });
    Array.prototype.forEach.call(document.querySelectorAll('video'), function (v) { io.observe(v); });
  </script>
  <script src="lingobites-live.js?v=5"></script>
</body>
</html>
