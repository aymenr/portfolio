<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingoda live screens (throwaway)</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lingoda-carousel-live.css">
  <style>
    body { margin: 0; padding: 24px clamp(12px, 3vw, 40px) 60px; font: 400 15px/1.4 'Open Sans', sans-serif; background: #f4f2fb; color: #1b1740; }
    h1 { font-size: 1.1rem; margin: 0 0 4px; }
    p.n { margin: 0 0 22px; color: #6b6890; font-size: .85rem; }
    h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; margin: 28px 0 10px; color: #6b6890; }
    .cs-car-art { padding: 18px; border-radius: 12px; background: linear-gradient(135deg, #d3d9fb, #ecd3f5); }
    @media (max-width: 760px) { .cs-car-art { padding: 14px 10px; } }
  </style>
</head>
<body>
  <h1>All 24 Lingoda carousel screens, live</h1>
  <p class="n">Throwaway page. Console: <code>__lcl.seekAll(ms)</code> freezes at a time, <code>__lcl.freeze(false)</code> resumes.</p>
  <h2>1 · Onboarding &amp; login</h2>
  <div class="cs-car-art"><div class="lcl" data-slide="a1" aria-label="Onboarding and login screens"></div></div>
  <h2>2 · Homepage, course &amp; classes</h2>
  <div class="cs-car-art"><div class="lcl" data-slide="a2" aria-label="Homepage, course and classes screens"></div></div>
  <h2>3 · Vocabulary trainer</h2>
  <div class="cs-car-art"><div class="lcl" data-slide="a3" aria-label="Vocabulary trainer screens"></div></div>
  <h2>4 · Lingobites</h2>
  <div class="cs-car-art"><div class="lcl" data-slide="a4" aria-label="Lingobites screens"></div></div>
  <script src="lingoda-carousel-live.js"></script>
</body>
</html>
